<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Darell - Portfolio</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background-color: #ffffff;
            color: #1a1a1a;
            line-height: 1.6;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 0 20px;
        }

        /* Header */
        header {
            padding: 80px 0 60px;
            text-align: center;
        }

        .profile-placeholder {
            width: 150px;
            height: 150px;
            background-color: #f0f0f0;
            border-radius: 50%;
            margin: 0 auto 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 48px;
            color: #999;
        }

        h1 {
            font-size: 42px;
            font-weight: 600;
            margin-bottom: 8px;
            letter-spacing: -0.5px;
        }

        .role {
            font-size: 18px;
            color: #666;
            font-weight: 400;
        }

        /* Section */
        section {
            padding: 60px 0;
        }

        h2 {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 32px;
            letter-spacing: -0.3px;
        }

        /* Projects */
        .project-card {
            background: #fafafa;
            border: 1px solid #eaeaea;
            border-radius: 8px;
            padding: 32px;
            margin-bottom: 24px;
            transition: border-color 0.2s;
        }

        .project-card:hover {
            border-color: #d0d0d0;
        }

        .project-title {
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 12px;
        }

        .project-link {
            color: #1a1a1a;
            text-decoration: underline;
            text-underline-offset: 3px;
            font-size: 14px;
        }

        .project-link:hover {
            color: #444;
        }

        /* Contact */
        .contact-info {
            font-size: 16px;
        }

        .contact-link {
            color: #1a1a1a;
            text-decoration: underline;
            text-underline-offset: 3px;
        }

        .contact-link:hover {
            color: #444;
        }

        /* Footer */
        footer {
            padding: 40px 0 60px;
            text-align: center;
            color: #999;
            font-size: 14px;
        }

        /* Responsive */
        @media (max-width: 600px) {
            h1 {
                font-size: 32px;
            }

            .role {
                font-size: 16px;
            }

            header {
                padding: 60px 0 40px;
            }

            section {
                padding: 40px 0;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div class="profile-placeholder">D</div>
            <h1>Darell</h1>
            <p class="role">Admin & Desain Grafis</p>
        </header>

        <section id="projects">
            <h2>Proyek</h2>
            <div class="project-card">
                <div class="project-title">Webcio.com</div>
                <a href="https://webcio.com" class="project-link" target="_blank" rel="noopener">webcio.com →</a>
            </div>
        </section>

        <section id="contact">
            <h2>Kontak</h2>
            <div class="contact-info">
                <a href="mailto:darel@gmail.com" class="contact-link">darel@gmail.com</a>
            </div>
        </section>

        <footer>
            © 2026 Darell. All rights reserved.
        </footer>
    </div>
</body>
</html>
